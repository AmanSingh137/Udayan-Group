# Production Configuration
server.port=8080
spring.application.name=jobs-api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/udayan_jobs?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=yourpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Configuration - CHANGE THIS IN PRODUCTION!
jwt.secret=change-this-to-a-very-secure-secret-key-in-production-environment-minimum-64-characters
jwt.expiration=86400000

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.root=INFO
logging.level.com.udayan.jobsapi=DEBUG



